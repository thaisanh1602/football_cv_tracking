# Cấu hình mặc định: BoT-SORT + new_track_thresh 0.8
# Chọn trên SNMOT-061..065, kiểm chứng trên SNMOT-066..070: HOTA 46.4 -> 53.6, IDSW 921 -> 257 so với mặc định Ultralytics
tracker_type: botsort
track_high_thresh: 0.25
track_low_thresh: 0.1
new_track_thresh: 0.8      # detector rất tự tin với người (P 0.99): detection conf thấp không ghép được thường là nhiễu, không phải người mới
track_buffer: 50
match_thresh: 0.8
fuse_score: True
gmc_method: sparseOptFlow   # camera broadcast lia liên tục nên GMC rất quan trọng
proximity_thresh: 0.5
appearance_thresh: 0.8
with_reid: False
model: yolo26n-cls.pt
